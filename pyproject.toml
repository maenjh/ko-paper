[project]
name = "kopaper"
version = "0.6.0"
description = "Layout-preserving English→Korean paper PDF translator backed by Claude"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
api = ["anthropic>=0.70"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
kopaper = "kopaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kopaper"]
