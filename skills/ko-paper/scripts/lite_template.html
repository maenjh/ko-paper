<style>
  @page { size: A4; margin: 18mm 16mm; }

  .eq { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; text-align: center; margin: 6pt 0; }

  thead th { border-top: 1pt solid #333; border-bottom: 0.8pt solid #333; }
  .refs p { font-family: "Times New Roman", serif; font-size: 8.5pt; line-height: 1.4; text-align: left;
